name: Deploy Backend

# Nothing in this workflow deploys anything yet.
#
# Every step of the old deploy and rollback jobs was an `echo` and a `sleep`
# next to a commented-out command. It ran on every push to main, spent about
# nine minutes on a release build, and then recorded a successful deployment
# against a GitHub `production` environment pointed at
# https://api.soroban-registry.com. The deployment history of this repository
# therefore shows around 145 production releases that never happened, and the
# merge of a documentation change was one of them.
#
# Two things changed, and neither invents a deployment story the repository does
# not have:
#
#   1. The trigger is workflow_dispatch only. A merge to main no longer claims
#      to have shipped, and no longer pays for a release build to say so.
#   2. The `environment:` block is gone, because that is the part that wrote the
#      false entry into the deployment history. Put it back in the same move
#      that wires up a real deploy, where its approval gate will mean something.
#
# The release build is kept: it is the one step here that was ever real, and it
# is worth being able to run on demand.

on:
  workflow_dispatch:
    inputs:
      deployment_strategy:
        description: 'Deployment Strategy (placeholder - nothing is deployed yet)'
        required: true
        default: 'blue-green'
        type: choice
        options:
          - blue-green
          - canary

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same reasoning as ci.yml: the default profile overruns a hosted runner's
  # disk on this workspace.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential

      - name: Install pinned toolchain
        # rust-toolchain.toml pins the channel; `rustup show` installs it on
        # demand. The old actions-rs/toolchain@v1 step was both archived and
        # wrong here, because it overrode that pin with stable.
        run: |
          set -euo pipefail
          rustup show
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            backend/target
          key: deploy-${{ runner.os }}-${{ hashFiles('**/rust-toolchain.toml', 'backend/Cargo.lock') }}
          restore-keys: |
            deploy-${{ runner.os }}-

      - name: Build backend
        run: cargo build --release --locked --manifest-path backend/Cargo.toml

  deploy:
    name: Deploy (not implemented)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: State plainly that no deployment happens here
        run: |
          set -euo pipefail
          echo "The release build succeeded. No deployment was performed."
          echo
          echo "Requested strategy: ${{ inputs.deployment_strategy }}"
          echo
          echo "Wiring this up means replacing this job with the real traffic"
          echo "shift for that strategy, and restoring the environment: block"
          echo "so the approval gate and the deployment record apply to"
          echo "something that actually ships."
