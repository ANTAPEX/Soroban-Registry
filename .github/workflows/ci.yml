name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege. Nothing here writes to the repository, comments on a pull
# request or publishes anything, so the default token scope is more than these
# jobs need.
permissions:
  contents: read

# The backend job is a full debug build of the workspace and takes the better
# part of ten minutes. Without this, pushing twice to a branch leaves two of
# them running against a commit nobody is waiting on. cli-ci.yml and
# smart-contract-ci.yml already do this.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'backend/**/*.rs'
              - 'backend/Cargo.toml'
              - 'backend/Cargo.lock'
              # Only one crate of the soroban-registry/ workspace is in the
              # backend build graph: backend/api path-depends on
              # crates/soroban-batch. The other five are built by nothing, so
              # matching the whole directory only started backend builds that
              # could not observe the change.
              - 'soroban-registry/crates/soroban-batch/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ── Backend ────────────────────────────────────────────────────────────
  #
  # Restored after the backend test targets were found not to compile at all on
  # main: `cargo check` passed while `cargo check --all-targets` failed, and
  # nothing in CI built a test target, so the rot was invisible. `cargo test`
  # below compiles every test target, which is the part that actually regressed.
  #
  # Deliberately not gated here: clippy and rustfmt. CONTRIBUTING.md prescribes
  # -D warnings, but the backend has pre-existing formatting and lint drift, so
  # enabling either would make this job red on arrival and teach people to
  # ignore it. Same reasoning as cli-ci.yml.
  backend:
    name: Backend (build, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Measured locally: a full debug build of this workspace is ~26 GB with
      # the default profile and 8.4 GB with these settings. The default
      # overruns a hosted runner's disk, so these are load-bearing rather than
      # tuning. Incremental artifacts are pure overhead for a single-shot CI
      # build, and line-tables-only keeps panic line numbers while dropping the
      # bulk of the debug info.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install system build dependencies
        run: |
          set -euo pipefail
          # openssl-sys is in the backend build graph via rust-s3 -> aws-creds
          # -> attohttpc -> native-tls.
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential

      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          # rust-toolchain.toml pins nightly; `rustup show` installs it on
          # demand. No dtolnay/actions-rs action, which would override the pin.
          rustup show
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            backend/target
          key: backend-${{ runner.os }}-${{ hashFiles('**/rust-toolchain.toml', 'backend/Cargo.lock') }}
          restore-keys: |
            backend-${{ runner.os }}-

      - name: Report disk headroom (before build)
        run: |
          set -euo pipefail
          # A full debug build of this workspace measured 8.4 GB locally with
          # the trimmed profile above, and ~26 GB without it. That fits a
          # hosted runner, but not so comfortably that it can go unwatched:
          # every tests/*.rs is its own crate statically linking the whole api
          # crate, so the footprint grows with each integration test file
          # added. These steps put the real numbers in the log rather than
          # leaving them to be rediscovered by a confusing linker failure.
          echo "::group::disk before build"
          df -h /
          echo "::endgroup::"

      - name: Test
        working-directory: backend
        run: |
          set -euo pipefail
          echo "::group::cargo test --workspace --locked"
          # Compiles and runs every target, unit and integration alike. Tests
          # marked #[ignore] need a live Postgres and are not run here.
          if ! cargo test --workspace --locked; then
            echo "::endgroup::"
            echo "::error::Backend tests failed. A clean checkout must compile and pass, including test targets."
            exit 1
          fi
          echo "::endgroup::"

      - name: Report disk headroom (after build)
        # Runs even on failure: if the build died from a full disk, this step
        # is what says so.
        if: always()
        run: |
          set -euo pipefail
          echo "::group::disk after build"
          df -h /
          du -sh backend/target 2>/dev/null || true
          echo "::endgroup::"
          avail_kb=$(df --output=avail / | tail -1)
          if [ "$avail_kb" -lt 2097152 ]; then
            echo "::warning::Under 2 GB of disk left after the backend build. Adding integration test files will start failing CI before it starts failing review."
          fi

  # ── Frontend ───────────────────────────────────────────────────────────
  #
  # Restored alongside the backend job. The component tests in particular were
  # never actually executing: tsconfig.json sets jsx "preserve" for Next/SWC,
  # which ts-jest inherited and emitted untransformed, so every .tsx suite died
  # on a parse error rather than running.
  #
  # Deliberately not gated here: eslint warnings. `npm run lint` reports ~210
  # warnings and zero errors today; failing on warnings would be red on arrival.
  frontend:
    name: Frontend (typecheck, lint, test, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # @reduxjs/toolkit 1.x declares a peer of react <= 18 and this project
        # is on react 19, so a strict resolve fails before anything is fetched.
        # The committed lockfile was resolved the same way. Upgrading the
        # dependency is a separate change; this only installs what is pinned.
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: |
          set -euo pipefail
          echo "::group::tsc --noEmit"
          if ! npx tsc --noEmit; then
            echo "::endgroup::"
            echo "::error::Frontend typecheck failed."
            exit 1
          fi
          echo "::endgroup::"

      - name: Lint
        run: |
          set -euo pipefail
          echo "::group::eslint"
          if ! npm run lint; then
            echo "::endgroup::"
            echo "::error::Frontend lint reported an error."
            exit 1
          fi
          echo "::endgroup::"

      - name: Test
        run: |
          set -euo pipefail
          echo "::group::jest"
          if ! npx jest --ci; then
            echo "::endgroup::"
            echo "::error::Frontend tests failed."
            exit 1
          fi
          echo "::endgroup::"

      - name: Build
        run: |
          set -euo pipefail
          echo "::group::next build"
          if ! npm run build; then
            echo "::endgroup::"
            echo "::error::Frontend production build failed."
            exit 1
          fi
          echo "::endgroup::"
