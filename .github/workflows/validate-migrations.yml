name: Validate Database Migrations

# The single migration check in this repository. ci.yml used to carry a second,
# weaker copy of it inline - an ordering loop that did not check filenames at
# all - which ran on every pull request whether or not a migration had changed.
# This one runs .github/scripts/validate-migrations.sh, which checks both the
# naming convention and the ordering, and only when migrations are touched.

on:
  pull_request:
    paths:
      - "database/migrations/**"
      - ".github/scripts/validate-migrations.sh"
      - ".github/workflows/validate-migrations.yml"
  push:
    branches:
      - main
    paths:
      - "database/migrations/**"

permissions:
  contents: read
  # The failure path comments on the pull request.
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Check Migration File Naming
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate migration files
        run: bash .github/scripts/validate-migrations.sh

      - name: Comment on PR (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Migration validation failed**\n\nPlease check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.\n\nA migration filename must be `<NNN>_name.sql` or `<YYYYMMDDHHMMSS>_name.sql`, lowercase, and must sort after every migration already merged.\n\nSee [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for the conventions.'
            })
