[package]
name = "soroban-registry-cli"
version = "0.1.0"
edition = "2021"
authors = ["Soroban Registry Contributors"]
license = "MIT"
build = "build.rs"

[[bin]]
name = "soroban-registry"
path = "src/main.rs"

[dependencies]
shared = { path = "../backend/shared" }
contract_abi = { path = "../backend/contract_abi" }
soroban-registry-client = { path = "../backend/registry_client" }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"rustls-tls",
	"multipart",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
colored = "3.1"
toml = "1.0"
dirs = "7.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.11"
hmac = "0.13"
flate2 = "1.0"
tar = "0.4"
tempfile = "3.14"
hex = "0.4"
rand = "0.9"
sysinfo = "0.37"
log = "0.4"
env_logger = "0.11"
serde_yaml = "0.9"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
base64 = "0.23"
bs58 = "0.5"
ripemd = "0.2"
rustyline = "18.0"
shlex = "2.0"
semver = "1.0"
csv = "1.4.0"
stellar-strkey = "0.0.18"
stellar-xdr = { version = "26.0.0", features = ["curr", "std", "base64"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[dev-dependencies]
criterion = "0.8"
wiremock = "0.6"
